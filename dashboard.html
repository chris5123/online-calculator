<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123c69" />
    <meta name="description" content="選務報表檢核 Dashboard" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>計票中心 - 後端調閱系統</title>
  </head>
  <body>
    <div class="app-shell dashboard-page">
      <header class="app-header">
        <div>
          <p class="eyebrow">Election Administration</p>
          <h1>📊 後端 Canvas 調閱系統</h1>
        </div>
        <nav class="app-nav" aria-label="主要導覽">
          <a class="nav-link" href="./">試算器</a>
          <a class="nav-link is-current" href="./dashboard.html">Dashboard</a>
          <span id="network-status" class="status-chip" data-tone="info">連線狀態：檢查中</span>
        </nav>
      </header>

      <main class="dashboard-content">
        <section class="page-card dashboard-toolbar" aria-labelledby="dashboard-controls-title">
          <div class="section-heading compact-heading">
            <div>
              <p class="eyebrow">Review Control</p>
              <h2 id="dashboard-controls-title">檢核工具列</h2>
            </div>
            <span id="dashboard-mode" class="muted-label">正式 API 模式</span>
          </div>
          <div class="dashboard-controls">
            <label for="user-role">目前帳號身分</label>
            <select id="user-role">
              <option value="">-- 請選擇身分 --</option>
              <optgroup label="檢核人員">
                <option value="A">檢核人員 A</option>
                <option value="B">檢核人員 B</option>
                <option value="C">檢核人員 C</option>
                <option value="D">檢核人員 D</option>
                <option value="E">檢核人員 E</option>
                <option value="F">檢核人員 F</option>
                <option value="G">檢核人員 G</option>
              </optgroup>
              <optgroup label="系統管理者（僅為前端選擇）">
                <option value="AdminX">管理員 X</option>
                <option value="AdminY">管理員 Y</option>
              </optgroup>
            </select>
            <button id="reload-list" class="button button-secondary" type="button">重新載入清單</button>
            <label for="list-search">搜尋票所</label>
            <input id="list-search" type="search" placeholder="輸入票所編號" />
          </div>
          <div id="dashboard-status" class="operation-status" data-tone="info" aria-live="polite">準備中</div>
        </section>

        <section class="dashboard-top-grid">
          <article class="page-card preview-card" aria-labelledby="preview-title">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">Report Preview</p>
                <h2 id="preview-title">報表影像</h2>
              </div>
              <div class="preview-actions">
                <span id="current-station" class="station-pill">尚未選擇</span>
                <button id="print-report" class="button button-secondary" type="button">列印 A3</button>
              </div>
            </div>
            <div id="image-container" class="image-container">
              <div id="image-loading" class="image-state">請由右側清單選擇票所</div>
              <img id="report-image" alt="選取票所的報表影像" hidden />
              <div class="zoom-controls" aria-label="影像縮放控制">
                <button id="zoom-in" class="icon-button" type="button" aria-label="放大">＋</button>
                <button id="zoom-out" class="icon-button" type="button" aria-label="縮小">−</button>
                <button id="zoom-reset" class="icon-button" type="button" aria-label="重設縮放">↺</button>
              </div>
            </div>
          </article>

          <section class="list-grid" aria-label="已回傳報表清單">
            <article class="page-card list-card">
              <div class="list-title gov-title">已回傳報表清單（公職）</div>
              <div id="header-gov" class="list-header"></div>
              <div id="list-gov" class="list-body"></div>
            </article>
            <article class="page-card list-card">
              <div class="list-title ref-title">已回傳報表清單（公投）</div>
              <div id="header-ref" class="list-header"></div>
              <div id="list-ref" class="list-body"></div>
            </article>
          </section>
        </section>

        <section class="page-card data-card" aria-labelledby="data-title">
          <div class="section-heading compact-heading">
            <div>
              <p class="eyebrow">Record Details</p>
              <h2 id="data-title">報表數值明細</h2>
            </div>
            <div class="status-actions">
              <label for="status-select">檢核判定</label>
              <select id="status-select">
                <option value="">-- 尚未判定 --</option>
                <option value="數字有誤(紅)">數字有誤（紅）</option>
                <option value="待補正(黃)">待補正（黃）</option>
                <option value="一聯報表ok(綠)">一聯報表 OK（綠）</option>
                <option value="一二聯報表ok(綠)">一二聯報表 OK（綠）</option>
              </select>
              <button id="update-status" class="button button-primary" type="button">更新燈號</button>
              <button id="unlock-record" class="button button-danger" type="button" hidden>強制解鎖</button>
            </div>
          </div>
          <div class="table-wrapper dashboard-table-wrapper" role="region" aria-label="報表數值明細" tabindex="0">
            <table class="data-table dashboard-data-table">
              <thead>
                <tr>
                  <th colspan="2" rowspan="2">選舉種類</th>
                  <th colspan="14">各候選人得票數</th>
                  <th rowspan="2">有效票數</th>
                  <th rowspan="2">無效票數</th>
                  <th rowspan="2">投票數</th>
                  <th rowspan="2">已領未投</th>
                  <th rowspan="2">發出票數</th>
                  <th rowspan="2">用餘票數</th>
                  <th rowspan="2">選舉人數</th>
                  <th rowspan="2">檢查值</th>
                </tr>
                <tr>
                  <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th>
                  <th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th>
                </tr>
              </thead>
              <tbody id="data-tbody">
                <tr><td colspan="26" class="empty-state">請由清單點選欲調閱的票所。</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="print-area" class="print-area" aria-hidden="true"><img id="print-image" alt="列印報表" /></div>
    <script type="module" src="/src/pages/dashboard.js"></script>
  </body>
</html>
